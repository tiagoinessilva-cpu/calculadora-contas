<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Contas e Gorjetas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 sm:p-8 flex flex-col items-center justify-center">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-black text-indigo-400">Calculadora de Contas 🧾</h1>
            <p class="text-slate-400 text-sm mt-1">Divide a conta e calcula gorjetas num instante.</p>
        </header>

        <!-- Valor da Conta -->
        <div class="bg-slate-800 p-4 rounded-xl mb-4">
            <label class="text-xs text-slate-300 font-semibold block mb-2">Valor Total da Conta (€)</label>
            <input type="number" id="conta" value="50.00" oninput="calcular()" 
                   class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white text-lg font-bold focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Gorjeta -->
        <div class="bg-slate-800 p-4 rounded-xl mb-4">
            <div class="flex justify-between text-xs text-slate-300 mb-2">
                <span>Percentagem de Gorjeta</span>
                <span id="labelGorjeta" class="font-bold text-indigo-400">10%</span>
            </div>
            <input type="range" id="gorjeta" min="0" max="25" step="5" value="10" oninput="calcular()" class="w-full accent-indigo-500">
        </div>

        <!-- Pessoas -->
        <div class="bg-slate-800 p-4 rounded-xl mb-6">
            <div class="flex justify-between text-xs text-slate-300 mb-2">
                <span>Número de Pessoas</span>
                <span id="labelPessoas" class="font-bold text-indigo-400">2</span>
            </div>
            <input type="range" id="pessoas" min="1" max="10" step="1" value="2" oninput="calcular()" class="w-full accent-indigo-500">
        </div>

        <!-- Resultados -->
        <div class="bg-indigo-950/40 border border-indigo-500/30 p-4 rounded-xl text-center space-y-2">
            <div>
                <span class="text-xs text-slate-400">Total por Pessoa:</span>
                <p id="totalPessoa" class="text-3xl font-black text-indigo-300">27.50€</p>
            </div>
        </div>
    </div>

    <script>
        function calcular() {
            const conta = parseFloat(document.getElementById('conta').value) || 0;
            const gorjetaPercent = parseFloat(document.getElementById('gorjeta').value) || 0;
            const pessoas = parseInt(document.getElementById('pessoas').value) || 1;

            document.getElementById('labelGorjeta').textContent = gorjetaPercent + '%';
            document.getElementById('labelPessoas').textContent = pessoas;

            const valorGorjeta = conta * (gorjetaPercent / 100);
            const totalGeral = conta + valorGorjeta;
            const porPessoa = totalGeral / pessoas;

            document.getElementById('totalPessoa').textContent = porPessoa.toFixed(2) + '€';
        }
        calcular();
    </script>
</body>
</html>
